<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>@TITLE@</title>
<!--icon-->
<style>
@font-face { font-family: Roboto; font-weight: 400; font-style: normal; src: url(fonts/roboto-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: Roboto; font-weight: 700; font-style: normal; src: url(fonts/roboto-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: Roboto; font-weight: 400; font-style: italic; src: url(fonts/roboto-latin-400-italic.woff2) format('woff2'); }
@font-face { font-family: Roboto; font-weight: 700; font-style: italic; src: url(fonts/roboto-latin-700-italic.woff2) format('woff2'); }
@font-face { font-family: Roboto; font-weight: 400; font-style: normal; src: url(fonts/roboto-latin-ext-400-normal.woff2) format('woff2'); unicode-range: U+0100-02AF, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: Roboto; font-weight: 700; font-style: normal; src: url(fonts/roboto-latin-ext-700-normal.woff2) format('woff2'); unicode-range: U+0100-02AF, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
#stage { position: absolute; overflow: hidden; background: #000; }
#stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#gl { visibility: hidden; }
#ui { touch-action: none; }
.hw-input { position: absolute; box-sizing: border-box; margin: 0; padding: 0; border: 0; outline: 0; background: transparent; resize: none; caret-color: currentColor; z-index: 2; }
.hw-web { position: absolute; border: 0; background: #fff; z-index: 1; }
#loading { position: absolute; left: 20%; right: 20%; top: 60%; height: 4px; background: #222; }
#bar { height: 100%; width: 0; background: #7aa7d8; transition: width .2s; }
#label { position: absolute; left: 0; right: 0; top: 12px; text-align: center; color: #888; font: 13px sans-serif; }
#menu { position: absolute; right: 6px; bottom: 6px; width: 40px; height: 40px; border-radius: 20px; border: 0; padding: 0; display: none; z-index: 3;
  background: rgba(40, 40, 40, .55); color: #fff; font: bold 22px/40px sans-serif; cursor: pointer; }
#menu:hover { background: rgba(60, 60, 60, .8); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="800" height="480"></canvas>
  <canvas id="ui" width="800" height="480"></canvas>
  <div id="loading"><div id="bar"></div><div id="label"></div></div>
  <button id="menu" title="Menu" aria-label="Menu">⋮</button>
</div>
<script type="module" src="hw.js"></script>
</body>
</html>
